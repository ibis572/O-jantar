
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>O Jantar.</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- MENU INICIAL -->
    <main id="menu" class="menu">

        <div class="menu-content">

            <h1 class="game-title">O Jantar.</h1>

            <p class="subtitle">
                Uma história sobre aquilo que esquecemos.
            </p>

            <nav class="menu-buttons">
                <button id="start-button">Iniciar</button>
                <button id="continue-button">Continuar</button>
                <button id="options-button">Opções</button>
            </nav>

            <p class="version">Versão 0.1</p>

        </div>

    </main>


    <!-- TELA DO JOGO -->
    <main id="game" class="game hidden">

        <!-- CENÁRIO -->
        <div id="scene-background" class="scene-background"></div>

        <!-- PERSONAGEM -->
        <div class="character-container">
            <img
                id="character-sprite"
                class="character-sprite hidden"
                src=""
                alt="Personagem em cena"
            >
        </div>

        <!-- TÍTULO -->
        <div id="chapter-title" class="chapter-title">
            PRÓLOGO
        </div>

        <!-- DIÁLOGO -->
        <section class="dialogue-box">

            <p id="speaker" class="speaker"></p>

            <p id="dialogue" class="dialogue-text">
                Clique em Iniciar para começar.
            </p>

            <span class="continue-indicator">▼</span>

        </section>

        <button class="next-button" id="next-button">
            Continuar
        </button>

    </main>


    <!-- JAVASCRIPT -->
    <script type="module" src="./js/script.js"></script>

</body>
</html>
